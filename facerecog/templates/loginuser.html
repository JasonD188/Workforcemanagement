<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cre8ted Travel HRMS — Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: {
            950: '#0f1b3f',
            900: '#152252',
            800: '#1c2c66',
          },
          gold: {
            600: '#b8860b',
            500: '#c99a2e',
            400: '#d4af37',
          }
        },
        fontFamily: {
          sans: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        }
      }
    }
  }
</script>

<style>
  body { font-family: 'Inter', sans-serif; }

  /* Full-screen blurred background photo.
     Ginagamit ang Flask url_for (kaparehong paraan ng logo sa ibaba)
     para tama ang path kahit saan pa i-deploy, at direkta sa
     static/ folder (walang images/ subfolder) — kaparehong lokasyon
     ng logo file. */
  .bg-photo {
    position: fixed;
    inset: 0;
    background-image: url("{{ url_for('static', filename='backgroundlogin.png') }}");
    background-size: cover;
    background-position: center 20%;
    filter: blur(3px);
    transform: scale(1.1); /* itago ang blurred edges */
    z-index: -1;
  }

  /* Dark overlay para mas mabasa ang card sa ibabaw ng litrato */
  .bg-overlay {
    position: fixed;
    inset: 2;
    background: rgba(15, 27, 63, 0.35);
    z-index: -1;
  }
</style>
</head>
<body class="min-h-screen flex items-start sm:items-center justify-center p-0 sm:p-6">

  <div class="bg-photo"></div>
  <div class="bg-overlay"></div>

  <div class="w-full max-w-[480px] sm:max-w-sm bg-white sm:rounded-2xl sm:shadow-xl sm:shadow-slate-900/40 overflow-hidden">

    <!-- Header -->
  <div class="mx-auto mb-3 w-28 h-28 relative overflow-hidden rounded-full border-4 border-white shadow-lg">
      <!-- Logo mark -->
      <div class="mx-auto mb-3 w-28 h-28 relative">
        <img
         src="{{ url_for('static', filename='logo (2).jpg') }}"
          alt="Cre8ted Travel logo"
          class="w-full h-full object-contain"
        />
      </div>
      <div>
        <span class="text-[26px] leading-none font-extrabold tracking-wide text-navy-900">CRE<span class="text-gold-600">8</span>TED</span>
      </div>
      <div class="text-[11px] font-bold tracking-[0.4em] text-navy-900 mt-0.5">TRAVEL</div>
    </div>

    <!-- Title block -->
    <div class="px-8 pt-5 text-center">
      <h1 class="text-[22px] font-extrabold text-navy-900 tracking-tight">CRE8TED TRAVEL</h1>
      <p class="text-[15px] font-semibold text-gold-600 mt-1">Human Resource Management System</p>
    </div>

    <hr class="border-slate-200 mx-8 mt-6" />

    <!-- Form -->
    <form id="loginForm" class="px-8 pt-6 pb-8 space-y-5">
      <h2 class="text-lg font-bold text-navy-900">Sign in to your account</h2>

      <div class="space-y-1.5">
        <label for="employeeId" class="block text-sm font-semibold text-navy-900">QR ID</label>
        <input
          id="employeeId"
          name="employee_id"
          type="text"
          required
          placeholder="Enter your QR ID"
          autocomplete="username"
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-navy-800/40 focus:border-navy-800"
        />
      </div>

      <div class="space-y-1.5">
        <label for="password" class="block text-sm font-semibold text-navy-900">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          placeholder="Enter your password"
          autocomplete="current-password"
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-navy-800/40 focus:border-navy-800"
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-navy-900 hover:bg-navy-800 active:bg-navy-950 transition-colors text-white font-bold py-3.5 text-[15px]"
      >
        Sign In
      </button>

      <p id="formMsg" class="text-center text-xs font-medium hidden"></p>

      <p class="text-center text-xs text-slate-400 pt-1">
        No account yet?
        <a href="#" id="showRegister" class="text-gold-600 font-semibold hover:underline">Create one</a>
      </p>
    </form>

  </div>

<script>

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('formMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const employee_id = document.getElementById('employeeId').value.trim();
    const password = document.getElementById('password').value;

    msg.classList.remove('hidden', 'text-red-600', 'text-green-600');
    msg.textContent = 'Signing in…';
    msg.classList.add('text-slate-400');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employee_id, password })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        msg.classList.remove('text-slate-400');
        msg.classList.add('text-green-600');
        msg.textContent = 'Signed in. Redirecting…';
        window.location.href = '/dashboard';
      } else {
        msg.classList.remove('text-slate-400');
        msg.classList.add('text-red-600');
        msg.textContent = data.error || 'Invalid QR ID or password.';
      }
    } catch (err) {
      msg.classList.remove('text-slate-400');
      msg.classList.add('text-red-600');
      msg.textContent = 'Could not reach the server.';
    }
  });

  document.getElementById('showRegister').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = '/register';
  });
</script>

</body>
</html>
